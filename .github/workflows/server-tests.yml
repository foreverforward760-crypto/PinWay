name: PinWay Server Tests

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install server dependencies
        run: npm install
      - name: Check server JavaScript syntax
        run: |
          node --check routes/transactions.js
          node --check services/pinService.js
      - name: Run server tests
        run: npm test -- --runInBand
