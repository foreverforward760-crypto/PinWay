version: "3.9"

services:

  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pinway}
      POSTGRES_USER: ${DB_USER:-pinway_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"             # Remove this line in production (no external DB access)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pinway_user} -d ${DB_NAME:-pinway}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js API Server ─────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/logs:/app/logs

  # ─── React Frontend ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}

volumes:
  pgdata:
